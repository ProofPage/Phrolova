name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 빌드 및 GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 의존성 설치
        run: npm ci
        working-directory: frontend

      - name: 프론트엔드 빌드
        run: npm run build
        working-directory: frontend

      - name: Python 의존성과 PyInstaller 설치
        run: python -m pip install -r backend/requirements.txt pyinstaller pillow pystray

      - name: Windows 실행 파일 빌드
        run: python -m PyInstaller --clean --noconfirm rookery.spec

      - name: Windows Defender 검사 및 SHA-256 출력
        shell: pwsh
        run: |
          $asset = Join-Path (Get-Location) 'dist/Rookery.exe'
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw '빌드된 실행 파일을 찾을 수 없습니다.'
          }
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not $status.AntivirusEnabled) {
            throw 'Windows Defender Antivirus가 활성화되어 있지 않아 검증할 수 없습니다.'
          }
          Start-MpScan -ScanType CustomScan -ScanPath $asset -ErrorAction Stop
          Start-Sleep -Seconds 10
          $detections = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
            (($_.Resources | Out-String) -like "*$asset*")
          }
          if ($detections) {
            $names = ($detections | ForEach-Object ThreatName | Sort-Object -Unique) -join ', '
            throw "Windows Defender가 릴리스 파일을 탐지했습니다: $names"
          }
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw 'Windows Defender 검사 후 실행 파일이 격리되거나 삭제되었습니다.'
          }
          Get-FileHash -LiteralPath $asset -Algorithm SHA256 | Format-List

      - name: 릴리스 파일 이름 설정
        shell: pwsh
        run: Move-Item dist/Rookery.exe "dist/Rookery-$env:GITHUB_REF_NAME-windows-x64.exe"

      - name: GitHub Release 생성 및 Latest 갱신
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          시스템 관리의 업데이트 체커가 사용자의 ProofPage/Phrolova 저장소에서 최신 릴리스를 확인하도록 수정한 릴리스입니다.

          - 시스템 정보의 저장소 링크를 ProofPage/Phrolova로 변경
          - Linux 설치 및 업데이트 스크립트가 ProofPage/Phrolova를 사용
          - v2.0.11의 치지직 VOD 수정 및 Defender 탐지 위험 완화 포함

          Windows x64 실행 파일을 내려받아 기존 Rookery.exe와 교체하세요. 설정과 저장 데이터는 유지됩니다.
          '@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          $asset = "dist/Rookery-$env:GITHUB_REF_NAME-windows-x64.exe"
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME $asset --title "Version $version" --notes-file release-notes.md --latest --verify-tag
