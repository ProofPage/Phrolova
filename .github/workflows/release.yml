name: Windows Release

on:
  push:
    branches:
      - "release/v*.*.*"
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 빌드 및 GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^release/', ''
          if ($tag -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Invalid release version' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 프론트엔드 의존성 설치
        run: npm ci
        working-directory: frontend

      - name: 프론트엔드 빌드
        run: npm run build
        working-directory: frontend

      - name: Python 의존성과 PyInstaller 설치
        run: python -m pip install -r backend/requirements.txt pyinstaller pillow pystray

      - name: Windows 실행 파일 빌드
        run: python -m PyInstaller --clean --noconfirm phrolova.spec

      - name: Windows Defender 검사 및 SHA-256 출력
        shell: pwsh
        run: |
          $asset = Join-Path (Get-Location) 'dist/Phrolova.exe'
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw '빌드된 실행 파일을 찾을 수 없습니다.'
          }
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not $status.AntivirusEnabled) {
            throw 'Windows Defender Antivirus가 활성화되어 있지 않아 검증할 수 없습니다.'
          }
          Start-MpScan -ScanType CustomScan -ScanPath $asset -ErrorAction Stop
          Start-Sleep -Seconds 10
          $detections = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
            (($_.Resources | Out-String) -like "*$asset*")
          }
          if ($detections) {
            $names = ($detections | ForEach-Object ThreatName | Sort-Object -Unique) -join ', '
            throw "Windows Defender가 릴리스 파일을 탐지했습니다: $names"
          }
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw 'Windows Defender 검사 후 실행 파일이 격리되거나 삭제되었습니다.'
          }
          Get-FileHash -LiteralPath $asset -Algorithm SHA256 | Format-List

      - name: 릴리스 파일 이름 설정
        shell: pwsh
        run: Move-Item dist/Phrolova.exe "dist/Phrolova-$env:RELEASE_TAG-windows-x64.exe"

      - name: GitHub Release 생성 및 Latest 갱신
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          ## CHZZK VOD preparation and batch downloads

          - Add drag-and-drop and multi-URL registration to the existing Downloads page.
          - Show metadata cards, real per-video quality options and individual/batch start controls.
          - Persist prepared VODs and selected quality using the existing SQLite history.
          - Keep pause/resume/cancel/retry controls and add history-only removal; downloaded files are preserved.
          - Add Korean, English and Japanese UI strings and responsive mobile controls.
          - Keep CHZZK live recording on Streamlink -> FFmpeg. Existing yt-dlp, manual CDN selection and FFprobe checks remain in use.

          Validation: 490 Python tests passed; TypeScript and production build passed. Chromium UI checks passed at 390/1440px; existing 320/390/820/1024/1440px player/layout regressions passed. Local mock CDN downloads, merging, cancellation, shutdown and restart persistence tested.
          External CHZZK/CDN downloads and this patch on Termux, ARM64 and Windows devices remain unverified. Windows executable is CI-built.
          Existing chzzkpy dependency advisory limitations remain. See docs/vod-batch-ui-audit-ko.md.

          Windows: stop the application before replacing the executable; preserve settings and data.
          Linux/Termux: use source archives and docs/linux-guide.md or docs/termux-guide.md. The exe is Windows-only.
          '@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          $asset = "dist/Phrolova-$env:RELEASE_TAG-windows-x64.exe"
          $version = $env:RELEASE_TAG.TrimStart('v')
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            gh release create $env:RELEASE_TAG $asset --title "Version $version" --notes-file release-notes.md --latest --verify-tag
          } else {
            gh release create $env:RELEASE_TAG $asset --title "Version $version" --notes-file release-notes.md --latest --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
