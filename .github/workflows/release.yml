name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 빌드 및 GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 정적 파일 빌드
        shell: pwsh
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          New-Item -ItemType Directory -Force backend/app/static | Out-Null
          Copy-Item frontend/dist/* backend/app/static -Recurse -Force

      - name: Python 의존성과 PyInstaller 설치
        run: python -m pip install -r backend/requirements.txt pyinstaller pillow pystray

      - name: Windows 실행 파일 빌드
        run: python -m PyInstaller --clean --noconfirm rookery.spec

      - name: 릴리스 파일 이름 설정
        shell: pwsh
        run: Move-Item dist/Rookery.exe "dist/Rookery-$env:GITHUB_REF_NAME-windows-x64.exe"

      - name: GitHub Release 생성 및 Latest 갱신
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          치지직 VOD가 일부만 다운로드된 뒤 완료로 표시되던 문제를 수정한 릴리스입니다.

          - Akamai 글로벌 CDN 우선 사용 및 Naver CDN 폴백
          - 다운로드 시간 제한과 세그먼트 재시도 완화
          - 완료 전에 원본 영상 길이와 파일 길이 비교
          - 치지직 VOD 재시도 최대 5회

          Windows x64 실행 파일을 내려받아 기존 Rookery.exe와 교체하세요. 설정과 저장 데이터는 유지됩니다.
          '@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          $asset = "dist/Rookery-$env:GITHUB_REF_NAME-windows-x64.exe"
          gh release create $env:GITHUB_REF_NAME $asset --title "$env:GITHUB_REF_NAME — 치지직 VOD 다운로드 수정" --notes-file release-notes.md --latest --verify-tag
