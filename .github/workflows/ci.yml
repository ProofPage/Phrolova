name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 연속으로 푸시하면 이전 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 테스트 (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.requirements }})
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        python: ["3.14.8"]
        requirements: [requirements.txt]
        include:
          - os: ubuntu-24.04-arm
            python: "3.14"
            requirements: requirements-termux.txt
          - os: ubuntu-latest
            python: "3.15"
            requirements: requirements.txt
            experimental: true
          - os: windows-latest
            python: "3.15"
            requirements: requirements.txt
            experimental: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 의존성 설치
        run: |
          python -m pip install -r backend/${{ matrix.requirements }} pytest pytest-asyncio
          python -m pip check

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 영상 검증 도구 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Windows 영상 검증 도구 설치
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: macOS 영상 검증 도구 설치
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: POSIX 설치 스크립트 문법 검사
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/manage.sh
          bash -n scripts/install-termux.sh
          bash -n scripts/healthcheck.sh

      # pytest.ini의 testpaths가 tests라서 backend/에서 실행해야 한다.
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: 프론트엔드 타입체크와 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 다국어 리소스와 포맷 검사
        working-directory: frontend
        run: |
          npm run i18n:check
          npm run i18n:test

      - name: 타입체크
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: 빌드
        working-directory: frontend
        run: npm run build
